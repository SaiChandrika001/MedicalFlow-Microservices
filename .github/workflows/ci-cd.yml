name: MedicalFlow CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  JAVA_VERSION: 17
  MAVEN_OPTS: -Xmx2g

jobs:
  build-and-test:
    name: Build and Test Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and test all modules
        run: |
          set -e
          for module in user-service appointment-service report-service api-gateway; do
            echo "=== Building $module ==="
            mvn -f "$module/pom.xml" -B clean test
          done

  flyway-validate:
    name: Flyway Migration Validation
    needs: build-and-test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Wait for MySQL to become available
        run: |
          for i in $(seq 1 30); do
            mysql -h127.0.0.1 -uroot -proot -e 'SELECT 1' && break
            echo 'Waiting for MySQL...'
            sleep 5
          done

      - name: Create service databases
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS medicalflow_users CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS medicalflow_appointments CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS medicalflow_reports CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"

      - name: Validate Flyway migrations for user-service
        run: |
          mvn -f user-service/pom.xml -B -Dflyway.url=jdbc:mysql://127.0.0.1:3306/medicalflow_users -Dflyway.user=root -Dflyway.password=root flyway:migrate flyway:validate

      - name: Validate Flyway migrations for appointment-service
        run: |
          mvn -f appointment-service/pom.xml -B -Dflyway.url=jdbc:mysql://127.0.0.1:3306/medicalflow_appointments -Dflyway.user=root -Dflyway.password=root flyway:migrate flyway:validate

      - name: Validate Flyway migrations for report-service
        run: |
          mvn -f report-service/pom.xml -B -Dflyway.url=jdbc:mysql://127.0.0.1:3306/medicalflow_reports -Dflyway.user=root -Dflyway.password=root flyway:migrate flyway:validate

  docker-validation:
    name: Docker Compose and Image Validation
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose syntax
        run: docker compose -f docker-compose.yml config

      - name: Build Docker images for services
        run: |
          docker compose -f docker-compose.yml build --pull user-service appointment-service report-service api-gateway

  security-scan:
    name: Security Dependency Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: owasp/dependency-check-action@v3
        with:
          scan: '.'
          format: 'ALL'
          failOnCVSS: '7'
          outputDirectory: 'dependency-check-report'

  sonar-analysis:
    name: SonarQube / SonarCloud Analysis
    needs: build-and-test
    if: ${{ secrets.SONAR_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run Sonar analysis for user-service
        run: |
          mvn -f user-service/pom.xml -B sonar:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Run Sonar analysis for appointment-service
        run: |
          mvn -f appointment-service/pom.xml -B sonar:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Run Sonar analysis for report-service
        run: |
          mvn -f report-service/pom.xml -B sonar:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Run Sonar analysis for api-gateway
        run: |
          mvn -f api-gateway/pom.xml -B sonar:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
