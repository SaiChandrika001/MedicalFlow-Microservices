server:
  port: 8080

spring:
  application:
    name: api-gateway
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 10s
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/(?<remaining>.*),/${remaining}
            - RequestRateLimiter=redis-rate-limiter.replenishRate=20,redis-rate-limiter.burstCapacity=40,redis-rate-limiter.requestedTokens=1
        - id: appointment-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/appointments/**
          filters:
            - RewritePath=/api/v1/(?<remaining>.*),/${remaining}
            - RequestRateLimiter=redis-rate-limiter.replenishRate=15,redis-rate-limiter.burstCapacity=30,redis-rate-limiter.requestedTokens=1
        - id: report-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/reports/**
          filters:
            - RewritePath=/api/v1/(?<remaining>.*),/${remaining}
            - RequestRateLimiter=redis-rate-limiter.replenishRate=10,redis-rate-limiter.burstCapacity=20,redis-rate-limiter.requestedTokens=1

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
    com.medicalflow.apigateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-change-me-change-me}
    header: Authorization
    prefix: Bearer 
    suffix: ''

resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        minimumNumberOfCalls: 5
      appointmentServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        minimumNumberOfCalls: 5
      reportServiceCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        minimumNumberOfCalls: 5

cors:
  allowed-origins: "http://localhost:3000,http://localhost:4200"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600
