global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['user-service:8081','appointment-service:8082','report-service:8084','api-gateway:8080']

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:16686']
